services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_koperasi}
      POSTGRES_USER: ${POSTGRES_USER:-koperasi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - koperasi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: koperasi:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgres://${POSTGRES_USER:-koperasi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-db_koperasi}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD wajib diisi}
    ports:
      - "${KOPERASI_PORT:-3100}:3100"
    command: ["sh", "-c", "node scripts/db.mjs migrate && npm start"]

volumes:
  koperasi_pgdata:
